name: Publish to pub.dev

# vX.Y.Z 태그 push 시 pub.dev 로 배포합니다.
# pub.dev Automated Publishing(OIDC) 사용 — 장기 토큰 불필요.
# 사전 조건: pub.dev 패키지 Admin → Automated publishing → GitHub Actions,
#            repository = send-go/flutter, tag pattern = v{{version}} 등록.
#
# dart-lang/setup-dart 의 재사용 워크플로(publish.yml@v1)를 쓰지 않고 단계를
# 직접 적는 이유:
#
#   setup-dart 는 `dart pub token add https://pub.dev --env-var PUB_TOKEN` 으로
#   OIDC 토큰을 자격증명에 등록한다. 그 뒤로는 pub.dev 로 가는 **모든** 요청에
#   Authorization 헤더가 붙는데, 이 토큰은 sendgo_flutter 를 발행할 권한만
#   갖는다. 그래서 의존성 해석이 공개 패키지를 읽는 것까지 403 이 되어
#
#     Because sendgo_flutter depends on test any which doesn't exist
#     (authorization failed)
#
#   로 죽었다(1.3.0 이 이것 때문에 세 번 실패했다). 의존성 해석에는 인증이
#   필요 없으므로, 그동안만 자격증명을 빼고 발행 직전에 되돌린다.
#   (PUB_TOKEN 환경변수를 비우는 방법은 안 된다 — 자격증명은 그대로 남아
#    "Credential token ... is not a valid" 로 exit 65 가 난다.)
on:
  push:
    tags:
      - "v*"
  # 태그를 태우지 않고 해석·분석·검증 단계만 돌려보기 위한 수동 실행.
  # 발행은 태그에서만 한다.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC (pub.dev Automated Publishing)
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: 의존성 해석 (자격증명 없이)
        run: |
          dart pub token remove https://pub.dev || true
          dart pub get

      - name: 정적 분석
        run: dart analyze --fatal-infos

      - name: 테스트
        run: dart test

      - name: pub.dev 자격증명 복구
        run: dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: 발행 검증
        run: dart pub publish --dry-run

      - name: pub.dev 발행
        if: github.ref_type == 'tag'
        run: dart pub publish --force
